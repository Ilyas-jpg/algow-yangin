# Eğitim verisini biriktiren zamanlanmış turlar.
#
# NEDEN GITHUB ACTIONS: Vercel cron'u özel başlık gönderemiyor (uçlar
# `x-ingest-secret` istiyor) ve Hobby planında günde bir kez sınırı var —
# 10 dakikalık tahmin günlüğü oradan yürümez. MTG ingest'i zaten dış bir
# zamanlayıcı çağırıyor; bu dosya aynı işi repo içinde, ayrı hesap
# gerektirmeden yapıyor.
#
# ⚠️ TEK KURULUM ADIMI: depo → Settings → Secrets and variables → Actions
#    ML_INGEST_SECRET  = .env.local'deki değerin aynısı (Vercel'deki de aynı)
#    YANGIN_BASE_URL   = https://yangin.algow.net   (opsiyonel, varsayılan bu)
#
# ⚠️ GitHub cron'u GARANTİLİ DEĞİL: yoğun saatlerde 5-20 dk gecikebilir, nadiren
# atlanır. Tahmin günlüğü için sorun değil — kaçan tur bir sonrakinde yakalanır,
# uydu geçişi zaten saatlerde bir. Kritik bir alarm zinciri buraya bağlanmamalı.

name: ML veri turu

on:
  schedule:
    # Tahmin günlüğü: 15 dakikada bir. Yangın sezonu dışında da koşuyor;
    # aktif yangın yoksa uç zaten hiçbir şey yazmadan 200 dönüyor.
    - cron: "*/15 * * * *"
    # Doğrulama: saat başı. Konilerin en az 10 saat yaşlanması bekleniyor
    # (FIRMS NRT gecikmesi ölçüldü: 1-8 saat), o yüzden sık koşmanın anlamı yok.
    - cron: "7 * * * *"
    # Sağlık: saat başı, doğrulamadan ayrı dakikada (aynı anda iki uç çağırıp
    # birbirinin kotasını yemesin).
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Elle çalıştır: cone | verify | saglik | ikisi"
        required: false
        default: "ikisi"

concurrency:
  # Bir tur uzarsa (14 yangın × nokta meteorolojisi ~1 dk sürebiliyor) ikinci
  # tur üstüne binmesin: aynı olaya iki tahmin satırı açılmaz ama boşuna kota
  # harcar.
  group: ml-veri-turu
  cancel-in-progress: false

jobs:
  cone:
    name: Tahmin günlüğü
    # ⚠️ Koşul AÇIK yazılmalı. Eski hâli `|| inputs.job != 'verify'` idi ve
    # zamanlanmış çalışmada `inputs.job` boş olduğu için o parça HER kronda
    # doğru oluyordu — yeni bir `schedule` eklenince bu iş de onunla birlikte
    # tetiklenirdi (sağlık kronu eklenirken yakalandı, 2026-08-05).
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'verify' && github.event.inputs.job != 'saglik')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Koni tahminlerini kaydet
        env:
          BASE: ${{ vars.YANGIN_BASE_URL || 'https://yangin.algow.net' }}
          SECRET: ${{ secrets.ML_INGEST_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::ML_INGEST_SECRET tanımlı değil — depo ayarlarından ekle"
            exit 1
          fi
          kod=$(curl -sS --max-time 300 -o yanit.json -w '%{http_code}' \
            -H "x-ingest-secret: $SECRET" "$BASE/api/ml/cone")
          cat yanit.json; echo
          # 5xx gerçek arıza (tablo yok, DB düştü); 200 ise yangın olmasa da başarı.
          if [ "$kod" != "200" ]; then
            echo "::error::/api/ml/cone HTTP $kod"
            exit 1
          fi

  saglik:
    # Bu platformun iki ciddi arızası da SESSİZDİ: FIRMS'in boğulma yanıtı
    # "veri yok" sanıldı, ve doğrulama 8 km ötedeki ayrı yangını "baş" sayıp
    # günlerce yanlış karne üretti. İkisi de çökmedi, hata vermedi — durum kodu
    # izleyen bir araç ikisini de göremezdi. Bu iş, /api/saglik'in makullük
    # denetimleri düşerse GitHub'ı kırmızıya çevirir ve bildirim gönderir.
    name: Sağlık denetimi
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '37 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'saglik')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Platform kendi çıktısını denetlesin
        env:
          BASE: ${{ vars.YANGIN_BASE_URL || 'https://yangin.algow.net' }}
        run: |
          kod=$(curl -sS --max-time 90 -o saglik.json -w '%{http_code}' "$BASE/api/saglik")
          cat saglik.json; echo
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("saglik.json"))
          print(f"### {'✅ sağlıklı' if d.get('ok') else '🔴 ARIZA'}"
                f" · sezon içi: {d.get('sezonIci')}")
          print("| denetim | durum | değer | not |")
          print("|---|---|---|---|")
          for c in d.get("denetimler", []):
              print(f"| {c['ad']} | {'✅' if c['ok'] else '🔴'} | {c['deger']} | {c.get('not','')} |")
          PY
          # 503 = en az bir denetim düştü. Sessiz arızayı GÖRÜNÜR kılmak bu işin
          # tek amacı, o yüzden burada başarısız oluyoruz.
          if [ "$kod" != "200" ]; then
            echo "::error::/api/saglik HTTP $kod — yukarıdaki tabloda düşen denetime bak"
            exit 1
          fi

  verify:
    name: Tahmin doğrulama
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'cone' && github.event.inputs.job != 'saglik')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Gerçekleşeni tahminle karşılaştır
        env:
          BASE: ${{ vars.YANGIN_BASE_URL || 'https://yangin.algow.net' }}
          SECRET: ${{ secrets.ML_INGEST_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::ML_INGEST_SECRET tanımlı değil — depo ayarlarından ekle"
            exit 1
          fi
          kod=$(curl -sS --max-time 300 -o yanit.json -w '%{http_code}' \
            -H "x-ingest-secret: $SECRET" "$BASE/api/ml/verify")
          cat yanit.json; echo
          if [ "$kod" != "200" ]; then
            echo "::error::/api/ml/verify HTTP $kod"
            exit 1
          fi
          # Ölçülen hatayı iş özetine yaz: sezon boyunca tek yerden izlenebilsin.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("yanit.json"))
          print("| doğrulanan | ölçülen | gözlem yok | ort. hata |")
          print("|---|---|---|---|")
          print(f"| {d.get('verified',0)} | {d.get('measured',0)} | "
                f"{d.get('noObservation',0)} | {d.get('meanErrorDeg','—')}° |")
          PY
