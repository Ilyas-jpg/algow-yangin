# Platformun kendi çıktısını denetleyen saatlik tur.
#
# ⚠️ BU DOSYA ESKİDEN VERİ TOPLAMA CRON'UYDU. `cone` ve `verify` işleri
# 2026-08-06'da **Supabase pg_cron'a taşındı** (`supabase/migrations/0005_ml_cron.sql`).
#
# NEDEN TAŞINDILAR — ÖLÇÜLDÜ. GitHub zamanlanmış işleri ücretsiz/private
# depolarda ağır şekilde düşürüyor; beklenen günlük 144 tetiklemenin ~20'si
# gerçekleşiyordu:
#     Tahmin günlüğü  `*/15`        96 → 8  (~%11)
#     Tahmin doğrulama `7 * * * *`  24 → 5  (~%28)
#     Sağlık denetimi  `37 * * * *` 24 → 7  (~%38)
# Üstelik runner havuzu işi hiç almayabiliyor (`The job was not acquired by
# Runner of type hosted`) — iş çalışmadan koşu "başarısız" görünüyor ve yanlış
# alarm maili gidiyor. Veri toplayan iki uç için bu kabul edilemezdi.
#
# ⚠️ SAĞLIK DENETİMİ NEDEN HÂLÂ BURADA: tek amacı arıza olunca İNSANA haber
# vermek ve pg_cron'un e-posta kanalı yok. Saatte bir tetiklenip ~%38 teslim
# etmesi (≈2,5 saatte bir denetim) bir alarm için kabul edilebilir. Depodaki
# tetikleme sayısı 144→24'e düştüğü için teslim oranının iyileşmesi beklenir
# — beklenti, iddia değil; tekrar ölçülecek.
#
# ⚠️ TEK KURULUM ADIMI: depo → Settings → Secrets and variables → Actions
#    YANGIN_BASE_URL   = https://yangin.algow.net   (opsiyonel, varsayılan bu)
#    (ML_INGEST_SECRET artık BURADA GEREKMİYOR — sağlık ucu başlık istemiyor.
#     Sır Supabase Vault'ta `ml_ingest_secret` olarak duruyor, pg_cron oradan
#     okuyor. Depo secret'ı silinebilir; bırakılırsa da zararsız.)
#
# 🔧 cone/verify'ı ELLE tetiklemek için (SQL editöründen):
#    select public.yangin_ml_cagir('/api/ml/cone');
#    select public.yangin_ml_cagir('/api/ml/verify');

name: ML veri turu

on:
  schedule:
    # Saat başı :37. Doğrulamanın :07'siyle ayrı dakikada tutulmuştu ki iki uç
    # aynı anda üst kaynak kotası yemesin; doğrulama pg_cron'a taşındı ama
    # aynı gerekçe orada da geçerli, takvim korundu.
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: ml-veri-turu
  cancel-in-progress: false

jobs:
  saglik:
    # Bu platformun iki ciddi arızası da SESSİZDİ: FIRMS'in boğulma yanıtı
    # "veri yok" sanıldı, ve doğrulama 8 km ötedeki ayrı yangını "baş" sayıp
    # günlerce yanlış karne üretti. İkisi de çökmedi, hata vermedi — durum kodu
    # izleyen bir araç ikisini de göremezdi. Bu iş, /api/saglik'in makullük
    # denetimleri düşerse GitHub'ı kırmızıya çevirir ve bildirim gönderir.
    #
    # pg_cron'a taşınan iki uç da buradan izleniyor: cone → `cone_forecast`
    # tazeliği, verify → doğrulama kuyruğunun birikmesi. pg_net ateşle-unut
    # çalıştığı için HTTP durumunu kimse görmüyor; gözcü bu denetim.
    name: Sağlık denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Platform kendi çıktısını denetlesin
        env:
          BASE: ${{ vars.YANGIN_BASE_URL || 'https://yangin.algow.net' }}
        run: |
          kod=$(curl -sS --max-time 90 -o saglik.json -w '%{http_code}' "$BASE/api/saglik")
          cat saglik.json; echo
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("saglik.json"))
          print(f"### {'✅ sağlıklı' if d.get('ok') else '🔴 ARIZA'}"
                f" · sezon içi: {d.get('sezonIci')}")
          print("| denetim | durum | değer | not |")
          print("|---|---|---|---|")
          for c in d.get("denetimler", []):
              print(f"| {c['ad']} | {'✅' if c['ok'] else '🔴'} | {c['deger']} | {c.get('not','')} |")
          PY
          # 503 = en az bir denetim düştü. Sessiz arızayı GÖRÜNÜR kılmak bu işin
          # tek amacı, o yüzden burada başarısız oluyoruz.
          if [ "$kod" != "200" ]; then
            echo "::error::/api/saglik HTTP $kod — yukarıdaki tabloda düşen denetime bak"
            exit 1
          fi
